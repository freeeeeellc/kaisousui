<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>快走水 事業ダッシュボード</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(160deg, #062637, #0b3c5d 55%, #0a6ea6);
    color: #fff;
  }
  .box { width: min(760px, 100%); text-align: center; }
  .mark {
    width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 17px;
    background: linear-gradient(135deg, #00c2e0, #0a6ea6); display: grid; place-items: center; font-size: 30px;
  }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: .02em; }
  .sub { color: #9dc3da; font-size: 13px; letter-spacing: .14em; margin-bottom: 34px; }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
  a.tile {
    display: block; text-decoration: none; color: #fff; text-align: left;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 15px; padding: 24px; transition: transform .12s ease, background .12s ease;
  }
  a.tile:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); }
  a.tile .ico { font-size: 27px; }
  a.tile b { display: block; font-size: 18px; margin: 8px 0 5px; }
  a.tile .tag {
    font-size: 10.5px; font-weight: 700; letter-spacing: .06em; vertical-align: 2px;
    background: rgba(0,194,224,.25); border: 1px solid rgba(127,230,247,.45);
    color: #9fe8f7; border-radius: 999px; padding: 1px 8px; margin-left: 6px;
  }
  a.tile span { font-size: 13.5px; color: #b8d8ea; line-height: 1.75; }
  .foot { margin-top: 30px; font-size: 12px; color: #7ea9c4; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">💧</div>
  <h1>快走水</h1>
  <div class="sub">100% NATURAL ENERGY FOR ENGINES</div>

  <div class="links">
    <a class="tile" href="admin/index.html">
      <div class="ico">📊</div>
      <b>燃費データベース 管理画面</b>
      <span>導入先企業・車両・給油記録を登録し、使用前後の燃費と改善率を集計。車両ごとの導入効果レポートを出力します。</span>
    </a>
    <a class="tile" href="site/index.html">
      <div class="ico">🌐</div>
      <b>製品説明ホームページ</b>
      <span>法人向けの製品紹介サイト。実測データと費用対効果シミュレーターから、無料テスト導入の相談につなげます。</span>
    </a>
    <a class="tile" href="v2/index.html">
      <div class="ico">✨</div>
      <b>管理画面 V2 <span class="tag">検証中</span></b>
      <span>V2で入れる予定の動きの検証ページ。実運用モード（1回だけ動く）とデモモード（ループ）を切り替えて比較できます。</span>
    </a>
  </div>

  <div class="foot">バズウォール合同会社　kaisousui@buzzwall.jp</div>
</div>
</body>
</html>
